# ===================================================================
# Application Configuration: Temporal & Multidimensional Sales DB
# ===================================================================
server.port=8080
spring.application.name=Temporal-Sales-DB

# ===================================================================
# OPTION 1: DEFAULT LOCAL / H2 DATABASE (Active by default for zero-setup demo)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:temporalsalesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# OPTION 2: SUPABASE POSTGRESQL CONFIGURATION
# To connect to Supabase:
# 1. Get your Supabase connection string from: Project Settings -> Database -> Connection string (URI or JDBC)
# 2. Uncomment the 4 lines below and fill in your Supabase DB password and Project Host.
# ===================================================================
# spring.datasource.url=jdbc:postgresql://aws-0-[REGION].pooler.supabase.com:5432/postgres?sslmode=require
# spring.datasource.username=postgres.[PROJECT-REF]
# spring.datasource.password=YOUR_SUPABASE_DB_PASSWORD
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# JPA / Hibernate Settings
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Jackson JSON formatting
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
