# ===================================================================
# Server & Port Configuration (Cloud platforms inject $PORT automatically)
# ===================================================================
server.port=${PORT:8080}
spring.application.name=Temporal-Sales-DB

# ===================================================================
# Database Configuration: SUPABASE POSTGRESQL (Active)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.xouiqsflyqjkajiviupo}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:x2dFSrQWlwsIVK5n}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA / Hibernate PostgreSQL Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Jackson JSON formatting
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
