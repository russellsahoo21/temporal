# ===================================================================
# Server & Port Configuration (Cloud platforms inject $PORT automatically)
# ===================================================================
server.port=${PORT:8080}
spring.application.name=Temporal-Sales-DB

# ===================================================================
# Database Configuration:
# - Default: In-memory H2 database (works with zero configuration)
# - Supabase / PostgreSQL: Automatically activated if environment variables are provided
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:temporalsalesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA / Hibernate auto table creation/update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for local inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson JSON formatting
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
